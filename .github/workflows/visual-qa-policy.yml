name: Visual QA Policy

on:
  push:
    branches:
      - master
    paths:
      - qa/**
      - package.json
      - package-lock.json
      - .github/workflows/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: visual-qa-policy
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Fetch exact triggering commit without credentials
        shell: bash
        run: |
          set -euo pipefail
          repo_dir="${RUNNER_TEMP}/visual-qa"
          git init "${repo_dir}"
          git -C "${repo_dir}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${repo_dir}" fetch --depth=1 origin "${GITHUB_SHA}"
          git -C "${repo_dir}" checkout --detach FETCH_HEAD

      - name: Enforce QA security and test contracts
        working-directory: ${{ runner.temp }}/visual-qa
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node qa/policy-check.mjs
