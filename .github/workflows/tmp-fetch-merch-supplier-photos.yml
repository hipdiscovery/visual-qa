name: Temporary merch supplier photo fetch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tmp-fetch-merch-supplier-photos.yml

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Download verified supplier garment photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p merch-supplier-photos
          curl --fail --location --silent --show-error --retry 2             'https://image.spreadshirtmedia.com/image-server/v1/productTypes/812/views/1/appearances/823?width=450&height=600&backgroundColor=F2F2F2'             -o merch-supplier-photos/mens-premium-tee-front.jpg
          curl --fail --location --silent --show-error --retry 2             'https://image.spreadshirtmedia.com/image-server/v1/productTypes/813/views/1/appearances/2?width=450&height=600&backgroundColor=F2F2F2'             -o merch-supplier-photos/womens-premium-tee-front.jpg
          curl --fail --location --silent --show-error --retry 2             'https://image.spreadshirtmedia.com/image-server/v1/productTypes/635/views/1/appearances/2?width=450&height=600&backgroundColor=F2F2F2'             -o merch-supplier-photos/unisex-organic-tee-front.jpg
          curl --fail --location --silent --show-error --retry 2             'https://image.spreadshirtmedia.com/image-server/v1/productTypes/20/views/1/appearances/1?width=450&height=600&backgroundColor=F2F2F2'             -o merch-supplier-photos/mens-premium-hoodie-front.jpg
          curl --fail --location --silent --show-error --retry 2             'https://image.spreadshirtmedia.com/image-server/v1/productTypes/444/views/1/appearances/2?width=450&height=600&backgroundColor=F2F2F2'             -o merch-supplier-photos/womens-premium-hoodie-front.jpg
          curl --fail --location --silent --show-error --retry 2             'https://image.spreadshirtmedia.com/image-server/v1/productTypes/2089/views/1/appearances/1035?width=450&height=600&backgroundColor=F2F2F2'             -o merch-supplier-photos/unisex-organic-zip-hoodie-front.jpg
          curl --fail --location --silent --show-error --retry 2             'https://image.spreadshirtmedia.com/image-server/v1/productTypes/1432/views/1/appearances/251?width=450&height=600&backgroundColor=F2F2F2'             -o merch-supplier-photos/mens-premium-sweatshirt-front.jpg
          test "$(find merch-supplier-photos -type f -size +10k | wc -l)" -eq 7
          file merch-supplier-photos/*
      - name: Upload temporary supplier photo bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: merch-supplier-photos
          path: merch-supplier-photos/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
