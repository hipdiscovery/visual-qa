name: Temporary merch supplier photo fetch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tmp-fetch-merch-supplier-photos.yml

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Download verified supplier garment photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p merch-supplier-photos
          curl --fail --location --silent --show-error --retry 2 'https://images.weserv.nl/?url=https%3A%2F%2Fimage.spreadshirtmedia.com%2Fimage-server%2Fv1%2FproductTypes%2F812%2Fviews%2F1%2Fappearances%2F823%3Fwidth%3D450%26height%3D600%26backgroundColor%3DF2F2F2' -o 'merch-supplier-photos/mens-premium-tee-front.jpg'
          curl --fail --location --silent --show-error --retry 2 'https://images.weserv.nl/?url=https%3A%2F%2Fimage.spreadshirtmedia.com%2Fimage-server%2Fv1%2FproductTypes%2F813%2Fviews%2F1%2Fappearances%2F2%3Fwidth%3D450%26height%3D600%26backgroundColor%3DF2F2F2' -o 'merch-supplier-photos/womens-premium-tee-front.jpg'
          curl --fail --location --silent --show-error --retry 2 'https://images.weserv.nl/?url=https%3A%2F%2Fimage.spreadshirtmedia.com%2Fimage-server%2Fv1%2FproductTypes%2F635%2Fviews%2F1%2Fappearances%2F2%3Fwidth%3D450%26height%3D600%26backgroundColor%3DF2F2F2' -o 'merch-supplier-photos/unisex-organic-tee-front.jpg'
          curl --fail --location --silent --show-error --retry 2 'https://images.weserv.nl/?url=https%3A%2F%2Fimage.spreadshirtmedia.com%2Fimage-server%2Fv1%2FproductTypes%2F20%2Fviews%2F1%2Fappearances%2F1%3Fwidth%3D450%26height%3D600%26backgroundColor%3DF2F2F2' -o 'merch-supplier-photos/mens-premium-hoodie-front.jpg'
          curl --fail --location --silent --show-error --retry 2 'https://images.weserv.nl/?url=https%3A%2F%2Fimage.spreadshirtmedia.com%2Fimage-server%2Fv1%2FproductTypes%2F444%2Fviews%2F1%2Fappearances%2F2%3Fwidth%3D450%26height%3D600%26backgroundColor%3DF2F2F2' -o 'merch-supplier-photos/womens-premium-hoodie-front.jpg'
          curl --fail --location --silent --show-error --retry 2 'https://images.weserv.nl/?url=https%3A%2F%2Fimage.spreadshirtmedia.com%2Fimage-server%2Fv1%2FproductTypes%2F2089%2Fviews%2F1%2Fappearances%2F1035%3Fwidth%3D450%26height%3D600%26backgroundColor%3DF2F2F2' -o 'merch-supplier-photos/unisex-organic-zip-hoodie-front.jpg'
          curl --fail --location --silent --show-error --retry 2 'https://images.weserv.nl/?url=https%3A%2F%2Fimage.spreadshirtmedia.com%2Fimage-server%2Fv1%2FproductTypes%2F1432%2Fviews%2F1%2Fappearances%2F251%3Fwidth%3D450%26height%3D600%26backgroundColor%3DF2F2F2' -o 'merch-supplier-photos/mens-premium-sweatshirt-front.jpg'
          test "$(find merch-supplier-photos -type f -size +10k | wc -l)" -eq 7
          file merch-supplier-photos/*
      - name: Upload temporary supplier photo bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: merch-supplier-photos
          path: merch-supplier-photos/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
